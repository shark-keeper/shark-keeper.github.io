name: sharkkeeper
description: "부캉이 키우기 — 배포 중인 웹게임을 감싸는 앱 (Flutter WebView)"
publish_to: 'none'

# 스토어에 올릴 때마다 + 뒤의 빌드 번호를 1씩 올린다 (예: 1.0.1+2)
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.0
  google_mobile_ads: '>=5.3.0 <9.0.0'   # AdMob 보상형 광고

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/splash.png

# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app-icon-1024.png
  remove_alpha_ios: true
  adaptive_icon_foreground: assets/icon/adaptive-foreground.png
  adaptive_icon_background: assets/icon/adaptive-background.png

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#e7f6fd"
  image: assets/icon/splash.png
  android_12:
    color: "#e7f6fd"
    image: assets/icon/splash-android12.png
  ios_content_mode: center
  fullscreen: false
